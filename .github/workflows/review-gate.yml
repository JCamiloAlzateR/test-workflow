name: Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ocr-review:
    name: OCR Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: npm install -g @alibaba-group/open-code-review
      - name: Run OCR
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: ocr review --preview

  hermes-review:
    name: Hermes Autonomous Review
    runs-on: ubuntu-latest
    needs: ocr-review
    steps:
      - uses: actions/checkout@v4
      - name: Run Hermes Review
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          bash scripts/pr-review.sh "$PR_NUMBER" "$REPO"

  human-gate:
    name: Human Approval Gate
    runs-on: ubuntu-latest
    needs: hermes-review
    steps:
      - name: Check status
        run: |
          echo "✅ All automated checks passed"
          echo "🔍 Please review Hermes comments in the PR"
          echo "👍 Approve or Request Changes in GitHub"
